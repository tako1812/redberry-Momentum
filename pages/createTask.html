<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Momentum</title>

    <link rel="stylesheet" href="../styles/css/global.css" />
  </head>

  <body>
    <header>
      <div class="header-container">
        <div class="image-container">
          <img src="../assets/images/Momentum.png" alt="Momentum logo" />
          <img src="../assets/images/Hourglass.png" alt="image of hourglass" />
        </div>
        <nav>
          <ul class="main-nav-list">
            <li>
              <button class="btn btn-add-employee">თანამშრომლის შექმნა</button>
            </li>
            <li>
              <a href="#"><img src="../assets/icons/add.png" />შექმენი ახალი დავალება</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="test">
        <div class="create-task-container">
          <h2>შექმენი ახალი დავალება</h2>
          <form class="form-create-task">
            <div class="grids-container">
              <div class="grid-container">
                <div>
                  <label for="title">სათაური* </label>
                  <input
                    class="input input-title"
                    id="title"
                    type="text"
                    name="title"
                  />
                  <div class="title-validation-text">
                    <p>
                      მინიმუმ 2 სიმბოლო
                    </p>
                    <p>
                      მაქსიმუმ 255 სიმბოლო
                    </p>
                  </div>
                </div>
                <div>
                  <label for="select-department">დეპარტამენტი*</label>
                  <select
                    class="department-container"
                    name="department"
                    id="select-department2"
                  >
                    <option value="havetoStart">დაბალი</option>
                    <option value="მაღლი">მაღალი</option>
                    <option value="კახეთი">საშუალო</option>
                  </select>
  
                </div>
              </div>
              <div class="grid-container">
                <div>
                  <label for="description">აღწერა </label>
                  <textarea
                    name="description"
                    class="task-description"
                    minlength="2"
                    maxlength="255"
                  ></textarea>
                  <div class="description-validation-text">
                    <p>
                      მინიმუმ 2 სიმბოლო
                    </p>
                    <p>
                      მაქსიმუმ 255 სიმბოლო
                    </p>
                  </div>
                </div>
                <div>
                  <label for="select-employee">პასუხისმგებელი თანამშრომელი*</label>
                  <select
                    class="select"
                    name="employee"
                    id="select-employee1"
                  >
                    <option value="havetoStart">დაბალი</option>
                    <option value="მაღლი">მაღალი</option>
                    <option value="კახეთი">საშუალო</option>
                  </select>
  
                </div>
              </div>


              <div class="grid-container">
                <div class="priority-status-container">
                  <div class="dropdown-container">
                    <label>პრიორიტეტი*</label>
                    <div class="dropdown">
                      <button class="btn dropdown-btn">
                        <div class="default">
                          <img class="icon-selected"src="https://media.geeksforgeeks.org/wp-content/uploads/20200630132504/uflag.jpg" alt="priority icon"/>
                          <p class="category-selected">დაბალი</p>
                        </div>
                      </button>
                      
                      <div class="dropdown-content hidden">
                        <a class="img-icon-container">
                          <img id="dropdown-icon" src="https://media.geeksforgeeks.org/wp-content/uploads/20200630132504/uflag.jpg" alt="priority icon"/>
                          <p class="category">დაბალი</p>
                        </a>
                        <a class="img-icon-container" id="container">
                          <img id="dropdown-icon" src="https://media.geeksforgeeks.org/wp-content/uploads/20200630132500/bflag.jpg" alt="priority icon"/>
                          <p class="category">საშუალო</p>
                        </a>
                      </div>
                    </div>
                  </div>


                  <div>
                    <label for="select-status">სტატუსი*</label>
                    <select
                      class="statuses-container"
                      name="status"
                      id="select-status3"
                    >
                      <option value="havetoStart">
                        დაბალი
                      </option>
                      <option value="მაღლი">მაღალი</option>
                      <option value="კახეთი">საშუალო</option>
                    </select>
    
                  </div>
                </div>
                <div>
                  <label>დედლაინი</label>
                    <input class="data-input" type="date"/>
                </div>
              </div>      
            </div>  
          </form>
        </div>
      </section>
    </main>
    

    <footer></footer>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>  
    <script src="../js/createTask.js"></script>
    <script src="../js/validations.js"></script>
  </body>
</html>
