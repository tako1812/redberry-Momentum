<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Momentum</title>

    <link rel="stylesheet" href="../styles/css/global.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  
  </head>

  <body>
    <header>
      <div class="header-container">
        <div class="image-container">
          <img src="../assets/images/Momentum.png" alt="Momentum logo" />
          <img src="../assets/images/Hourglass.png" alt="image of hourglass" />
        </div>
        <nav>
          <ul class="main-nav-list">
            <li>
              <button class="btn btn-add-employee">თანამშრომლის შექმნა</button>
            </li>
            <li>
              <a href="#"><img src="../assets/icons/add.png" />შექმენი ახალი დავალება</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="detailed-section">
        <div class="taskDetaild-container">
          <div class="main-content">
            <div class="header-container">
              <div class="categ-dep-container">
                <div class="task-category">
                    <img src="../assets/images/Medium.png"/>
                    <p>საშუალო</p>
                </div>
                <div class="department">დიზიანი</div>
              </div>
              <h2>redberry-ს საიტის ლისტინგის დიზიანი</h2>
            </div>
            <div>
              <p>შექმენი საიტის მთავარი გვერდი, რომელიც მოიცავს მთავარ 
                  სექციებს და ნავიგაციას
              </p>
            </div>
          </div>
          <div class="details-content">
            <p class="heading-details">დავალების დეტალები</p>
            <div class="container status-container">
                <div class="icon-text-container">
                    <img src="../assets/icons/pie-chart.png" alt="pie-chart icon"/>
                    <p>სტატუსი</p>
                </div>
                <div>
                    <select
                        class="select statuses-container"
                        name="status"
                        id="select-status3"
                    >
                    <option> </option>
                    </select>
                </div>                       
            </div>
            <div class="container">
              <div class="icon-text-container">
                  <img src="../assets/icons/user.png" alt="user icon"/>
                  <p>თანამშრომელი</p>
              </div>
              <div class="employee-info-container">
                  <img src="../assets/images/customer-2.jpg" alt="responsible employee image"/>
                  <div>
                      <p>დეპარტამენტი</p>
                      <p>ანი არაბული</p>
                  </div>
                </div>
            </div>
            <div class="container">
              <div class="icon-text-container">
                  <img src="../assets/icons/calendar.png" alt="calendar icon"/>
                  <p>დავალების ვადა</p>
              </div>
              <p class="deadline-date">ორშ-02/08/2025</p>
            </div>

          </div>

        </div>

      </section>
      
    </main>
    
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>  
    <script src="../js/createTask.js"></script>
  </body>
</html>
